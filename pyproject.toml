[project]
name = "wsp-boltz2"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["boltz==2.2.1", "torch==2.8.0", "biopython==1.84", "pyyaml==6.0.2"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.uv.sources]
torch = {index = "pytorch-cu128"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

